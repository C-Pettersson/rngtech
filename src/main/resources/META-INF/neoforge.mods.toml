modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/c-pettersson/rngtech/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="rngtech-logo.png"
displayURL="https://www.curseforge.com/minecraft/mc-mods/rngtech"
authors="C-Pettersson"
description='''
RNGTech is a NeoForge technology mod about staged survival machines, installable Gear parts, machine rarity, affixes, refinement potential, ore processing, alloying, energy generation, energy storage, and recovery-focused automation surfaces.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
type="optional"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="refinedstorage"
type="optional"
ordering="AFTER"
side="BOTH"
