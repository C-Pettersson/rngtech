modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/c-pettersson/rngtech/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="rngtech-logo.png"
displayURL="https://www.curseforge.com/minecraft/mc-mods/rngtech"
authors="C-Pettersson"
description='''
A tech mod where your machines drop like loot. Machines, Gear parts, and Battery Cells roll rarity and affixes, Refinement Potential limits how far you can craft them, and machines level up on a shared passive tree with ascendancies. Build ore processing, alloying, power generation, and automation across nine material stages.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
type="optional"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="refinedstorage"
type="optional"
ordering="AFTER"
side="BOTH"
