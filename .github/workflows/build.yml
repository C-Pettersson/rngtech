name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gradle: ${{ steps.filter.outputs.gradle }}
      neogradle-key: ${{ steps.neogradle.outputs.key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect changes that need Gradle
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "gradle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$CHANGED"

          DOCS_ONLY='^(docs/|wiki/|tools/rngwiki/|src/guide/|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$|mkdocs(\.wiki)?\.yml$|requirements-docs\.txt$|compose\.docs\.yml$)'
          if grep -qvE "$DOCS_ONLY" <<< "$CHANGED"; then
            echo "gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "gradle=false" >> "$GITHUB_OUTPUT"
          fi

      # NeoGradle keys its task cache on input content, so only the inputs of the Minecraft setup belong in the key.
      - name: Compute NeoGradle cache key
        id: neogradle
        shell: bash
        run: |
          set -euo pipefail

          KEY="$(
            {
              grep -E '^(minecraft_version|neo_version|neogradle\.)' gradle.properties
              grep -F "id 'net.neoforged.gradle." build.gradle
              grep -F 'distributionUrl' gradle/wrapper/gradle-wrapper.properties
              cat src/main/resources/META-INF/accesstransformer.cfg 2>/dev/null || true
            } | sha256sum | cut -c1-16
          )"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

  # Pushes to main only build the NeoGradle Minecraft setup (decompile, patch, recompile) and save it for pull requests.
  neogradle-cache:
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup JDK 21
        id: java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Look up NeoGradle cache
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/ng_execute
          key: neogradle-${{ runner.os }}-java${{ steps.java.outputs.version }}-${{ needs.changes.outputs.neogradle-key }}
          lookup-only: true

      - name: Checkout repository
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Gradle
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Build the Minecraft setup
        if: steps.lookup.outputs.cache-hit != 'true'
        run: ./gradlew compileJava

      # Asset downloads are the largest entry and fast to fetch again, so they stay out of the cache.
      - name: Drop Minecraft assets from the NeoGradle cache
        if: steps.lookup.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          find ~/.gradle/caches/ng_execute -mindepth 2 -maxdepth 2 -type d -name objects -printf '%h\n' | xargs -r rm -rf
          du -sh ~/.gradle/caches/ng_execute

      - name: Save NeoGradle cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/ng_execute
          key: ${{ steps.lookup.outputs.cache-primary-key }}

  repository:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Node tooling
        run: npm ci

      - name: Check repository and ModDex
        run: |
          npm run repo:check
          npm run moddex:check

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Cache Minecraft client jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/wiki/client-*.jar
          key: minecraft-client-${{ hashFiles('tools/rngwiki/vanilla.py') }}

      - name: Build documentation
        run: |
          python -m pip install -r requirements-docs.txt
          python tools/rngwiki/vanilla.py --fetch
          mkdocs build --strict
          mkdocs build --strict -f mkdocs.wiki.yml

      - name: Check the in-game guide matches the wiki
        run: python tools/rngwiki/guideme.py --check

  gametest:
    needs: [changes, neogradle-cache]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.gradle == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        id: java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Restore NeoGradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/ng_execute
          key: neogradle-${{ runner.os }}-java${{ steps.java.outputs.version }}-${{ needs.changes.outputs.neogradle-key }}
          restore-keys: neogradle-${{ runner.os }}-

      - name: Run GameTests
        run: ./gradlew runGameTestServer

  build:
    needs: [changes, neogradle-cache]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.gradle == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        id: java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Restore NeoGradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/ng_execute
          key: neogradle-${{ runner.os }}-java${{ steps.java.outputs.version }}-${{ needs.changes.outputs.neogradle-key }}
          restore-keys: neogradle-${{ runner.os }}-

      - name: Check with Gradle
        run: ./gradlew ciCheck

      - name: Upload built mod jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rngtech-build-${{ github.run_number }}-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14
