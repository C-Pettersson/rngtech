name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must contain a numeric major.minor.patch version with optional prerelease/build suffixes." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release jar
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew ciCheck "-Pmod_version=$VERSION"

      - name: Locate release jar
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          JAR="build/libs/rngtech-${VERSION}.jar"

          if [[ ! -f "$JAR" ]]; then
            echo "Expected release jar not found: $JAR" >&2
            find build/libs -maxdepth 1 -type f -name '*.jar' -print >&2
            exit 1
          fi

          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Package optional FTB Quests extra
        id: ftbquests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          EXTRA="build/distributions/rngtech-ftbquests-${VERSION}.zip"

          mkdir -p build/distributions
          jar --create --no-manifest --file "$EXTRA" -C extras/ftbquests config

          echo "zip=$EXTRA" >> "$GITHUB_OUTPUT"

      - name: Upload release workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rngtech-${{ steps.version.outputs.version }}-mod-jar
          path: ${{ steps.artifact.outputs.jar }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload FTB Quests workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rngtech-${{ steps.version.outputs.version }}-ftbquests-extra
          path: ${{ steps.ftbquests.outputs.zip }}
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release and attach artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          JAR: ${{ steps.artifact.outputs.jar }}
          FTBQUESTS: ${{ steps.ftbquests.outputs.zip }}
        shell: bash
        run: |
          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$JAR" "$FTBQUESTS" --clobber
            if [[ ${#RELEASE_FLAGS[@]} -gt 0 ]]; then
              gh release edit "$GITHUB_REF_NAME" "${RELEASE_FLAGS[@]}"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$JAR" "$FTBQUESTS" --title "RNGTech v$VERSION" --generate-notes "${RELEASE_FLAGS[@]}"
          fi

      - name: Publish Maven package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew publishMavenJavaPublicationToGitHubPackagesRepository "-Pmod_version=$VERSION"
