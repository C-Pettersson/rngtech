// NeoGradle's plugin classpath brings vulnerable library versions; these build-time-only constraints lift them.
buildscript {
    dependencies {
        constraints {
            classpath 'com.fasterxml.jackson.core:jackson-core:2.18.11'
            classpath 'com.fasterxml.jackson.core:jackson-databind:2.18.11'
            classpath 'com.google.guava:guava:33.7.2-jre'
            classpath 'commons-io:commons-io:2.20.0'
            classpath 'org.apache.commons:commons-compress:1.28.0'
            classpath 'org.apache.commons:commons-lang3:3.20.0'
            classpath 'org.apache.ivy:ivy:2.5.3'
            classpath 'org.codehaus.plexus:plexus-utils:3.6.2'
        }
    }
}

plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.26'
    id 'com.diffplug.spotless' version '8.10.2'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net'
    }
    maven {
        name = 'JaredMaven'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
//minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

// Default run configurations.
// A linked git worktree has a .git file that points into the main checkout's .git/worktrees/<name>. Its runs use the
// main checkout's run directory, so every worktree launches with the same settings and worlds.
def sharedRunRoot = {
    def dotGit = project.file('.git')
    if (dotGit.isFile()) {
        def line = dotGit.readLines().find { it.startsWith('gitdir:') }
        def mainCheckout = line == null ? null : new File(line.substring('gitdir:'.length()).trim()).parentFile?.parentFile?.parentFile
        if (mainCheckout != null && new File(mainCheckout, '.git').isDirectory()) {
            return new File(mainCheckout, 'run')
        }
    }
    return project.file('run')
}()

// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        workingDirectory.set(new File(sharedRunRoot, name))

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Specify the version of Minecraft to use.
    // Depending on the plugin applied there are several options. We will assume you applied the userdev plugin as shown above.
    // The group for userdev is net.neoforged, the module name is neoforge, and the version is the same as the neoforge version.
    // You can however also use the vanilla plugin (net.neoforged.gradle.vanilla) to use a version of Minecraft without the neoforge loader.
    // And its provides the option to then use net.minecraft as the group, and one of; client, server or joined as the module name, plus the game version as version.
    // For all intends and purposes: You can treat this dependency as if it is a normal library you would use.
    implementation "net.neoforged:neoforge:${neo_version}"

    // Optional dev dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // Optional dev dependency with JEI Enhancements for bookmark grouping and crafting chain calculations.
    localRuntime "curse.maven:jei-enhancements-1424337:${jei_enhancements_file_id}"

    // Optional dev dependency with Jade for in-game block and entity inspection.
    compileOnly "curse.maven:jade-324717:${jade_file_id}"
    localRuntime "curse.maven:jade-324717:${jade_file_id}"

    // Optional dev dependency with Configured, used by JEI to expose in-game config screens
    localRuntime "curse.maven:configured-457570:${configured_file_id}"

    // Optional dev dependency with FTB Quests for validating pack quest chapters locally.
    // CurseMaven does not resolve these runtime mod dependencies transitively.
    localRuntime "curse.maven:ftb-quests-forge-289412:${ftb_quests_file_id}"
    localRuntime "curse.maven:ftb-teams-forge-404468:${ftb_teams_file_id}"
    localRuntime "curse.maven:ftb-library-forge-404465:${ftb_library_file_id}"
    localRuntime "curse.maven:architectury-api-419699:${architectury_file_id}"

    // Optional dev dependencies for cross-mod interaction checks.
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly "org.apiguardian:apiguardian-api:${apiguardian_version}"
    compileOnly "curse.maven:refined-storage-243076:${refined_storage_file_id}"
    localRuntime "curse.maven:refined-storage-243076:${refined_storage_file_id}"
    localRuntime "curse.maven:refined-storage-jei-integration-1230497:${refined_storage_jei_integration_file_id}"
    localRuntime "curse.maven:mekanism-268560:${mekanism_file_id}"
    localRuntime "curse.maven:mekanism-generators-268566:${mekanism_generators_file_id}"
    localRuntime "curse.maven:just-enough-mekanism-multiblocks-898746:${just_enough_mekanism_multiblocks_file_id}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

def githubRepository = System.getenv('GITHUB_REPOSITORY')

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
        }
    }
    repositories {
        maven {
            name = 'local'
            url = uri(layout.buildDirectory.dir('repo'))
        }
        if (githubRepository) {
            maven {
                name = 'GitHubPackages'
                url = uri("https://maven.pkg.github.com/${githubRepository}")
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

spotless {
    lineEndings = 'UNIX'

    java {
        target 'src/**/*.java'
        importOrder('com.rngtech', '', 'javax', 'java')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'misc', {
        target '*.gradle', '*.md', '.gitattributes', '.gitignore', 'gradle.properties', 'src/**/*.json', 'src/**/*.toml'
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }
}

tasks.named('check').configure {
    dependsOn 'spotlessCheck'
}

tasks.register('quickCheck') {
    group = 'verification'
    description = 'Runs fast local checks without launching Minecraft.'
    dependsOn 'spotlessCheck', 'compileJava', 'processResources'
}

tasks.register('ciCheck') {
    group = 'verification'
    description = 'Runs the same checks expected in CI.'
    dependsOn 'build'
}

sourceSets {
    masteryTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('masteryCheck', JavaExec) {
    group = 'verification'
    description = 'Checks shared mastery progression, build templates and modifier semantics.'
    dependsOn tasks.named('masteryTestClasses')
    classpath = sourceSets.masteryTest.runtimeClasspath
    mainClass = 'com.rngtech.rpg.progression.MasteryChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = layout.buildDirectory.dir('mastery-check').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.named('quickCheck') { dependsOn 'masteryCheck' }
tasks.named('check') { dependsOn 'masteryCheck' }

def localFtbQuestsDir = layout.projectDirectory.dir('config/ftbquests')
def devFtbQuestsDir = layout.projectDirectory.dir('run/client/config/ftbquests')

tasks.register('syncFtbQuestsDevConfig', Copy) {
    group = 'development'
    description = 'Copies local ignored FTB Quests config into the client run directory.'
    from localFtbQuestsDir
    into devFtbQuestsDir
}

tasks.register('syncFtbQuestsFromDevConfig', Sync) {
    group = 'development'
    description = 'Copies saved FTB Quests config from the client run directory back into local ignored config.'
    from devFtbQuestsDir
    into localFtbQuestsDir
    onlyIf {
        devFtbQuestsDir.asFile.exists()
    }
    doLast {
        localFtbQuestsDir.asFileTree.matching {
            include '**/*.snbt'
        }.files.each { file ->
            file.write(file.getText('UTF-8').replace("\r\n", "\n"), 'UTF-8')
        }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn tasks.named('syncFtbQuestsDevConfig')
    finalizedBy tasks.named('syncFtbQuestsFromDevConfig')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
