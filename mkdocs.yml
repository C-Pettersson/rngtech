site_name: RNGTech
site_description: Design and reference documentation for the RNGTech NeoForge mod.
repo_name: RNGTech
repo_url: https://github.com/c-pettersson/rngtech

exclude_docs: |
  page-templates/

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Conventions: conventions.md
  - Systems:
      - Machine Mastery: systems/machine-mastery.md
      - Affix Generation: systems/affix-generation.md
      - Stage Progression and Ore Duplication: systems/stage-progression-and-ore-duplication.md
  - Modifiers:
      - Overview: modifiers/index.md
  - Design Proposals:
      - Overview: design-proposals.md
      - Crafting and Upgrades: systems/crafting.md
      - Affix-Driven Generator: content/affix-driven-generator.md
      - Entropy Cell: content/entropy-cell.md
      - Ore Slurry Turbine: content/ore-slurry-turbine.md
      - Auto Balance: modifiers/auto-balance.md
      - Packer: modifiers/packer.md
      - Unique Item Ideas: reference/unique-item-ideas.md
      - Passive Tree Framework: prds/passive-tree-framework.md
      - Machine Mega Passive Tree: prds/machine-mega-passive-tree.md
      - Machine Mega Tree State: prds/machine-mega-passive-tree-state.md
      - Machine Ascendancies: prds/machine-ascendancies.md
      - Machine Ascendancies State: prds/machine-ascendancies-state.md
      - Tree Farm Requirements: prds/tree-farm-automation.md
      - Companion Rebalance: prds/companion-rebalance.md
      - Companion Rebalance State: prds/companion-rebalance-state.md
      - Unique Items: prds/uniques.md
      - Unique Items State: prds/uniques-state.md
      - Corruption: prds/corruption.md
      - Corruption State: prds/corruption-state.md
      - Batch Processing: prds/batch-processing.md
      - Batch Processing State: prds/batch-processing-state.md
      - Heat Model: prds/heat-model.md
      - Heat Model State: prds/heat-model-state.md
  - Reference:
      - Releasing: releasing.md
      - Public Mod Description: public-mod-description.md
      - Current Implementation Matrix: reference/current-implementation.md
      - Machine Guidelines: reference/machine-guidelines.md
      - Machine Visual Design: reference/machine-visual-design.md
      - Machine GUI Design: reference/machine-gui-design.md
      - Wiki Authoring: reference/wiki-authoring.md
      - Passive Tree Design Rules: reference/passive-tree-design-rules.md
      - Materials List: reference/materials.md
      - Material Catalog Coverage: reference/material-catalog-coverage.md
      - Material Usage Audit: reference/material-usage-audit.md
      - Component Stages: reference/component-stages.md
