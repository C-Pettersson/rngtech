site_name: RNGTech
site_description: Design and reference documentation for the RNGTech NeoForge mod.
repo_name: RNGTech
repo_url: https://github.com/c-pettersson/rngtech

exclude_docs: |
  page-templates/

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
